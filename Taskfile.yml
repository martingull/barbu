version: "3"

tasks:
  install:
    desc: Install frontend dependencies
    cmds:
      - npm install

  dev:
    desc: Run the browser development server
    cmds:
      - npm run dev

  build:
    desc: Build the Svelte frontend
    cmds:
      - npm run build

  cards:process:
    desc: Downscale card artwork and add rounded transparent corners; defaults to public/cards/cards, override with CARD_SOURCE_DIR=...
    cmds:
      - npm run cards:process

  ui:test:
    desc: Run browser interaction smoke tests
    cmds:
      - npm run test:e2e -- --workers 8

  ui:test:tables:
    desc: Run focused iPhone active-table stability checks
    cmds:
      - npm run test:e2e -- --grep "active game tables share|quick drill is a fixed|Hearts passing drill teaches|Hearts play starts|Hearts next hand carries|practice tab starts a full Domino|Perfect mode starts|Trump memory hand starts"

  core:test:
    desc: Run Rust tests for the card and rules engine
    cmds:
      - cargo test --manifest-path crates/barbu-core/Cargo.toml

  tauri:check:
    desc: Check the Tauri app crate
    cmds:
      - cargo check -p barbu-app

  fmt:
    desc: Format Rust code
    cmds:
      - cargo fmt

  verify:
    desc: Run the current project verification suite
    deps:
      - core:test
      - build
      - ui:test
      - tauri:check

  tauri:dev:
    desc: Run the Tauri development app
    cmds:
      - npm run tauri:dev

  ios:dev:
    desc: Run the Tauri iOS development target; pass a simulator/device name with `task ios:dev -- "iPhone 15"`
    cmds:
      - npm run tauri -- ios dev {{.CLI_ARGS}}

  ios:init:
    desc: Initialize the generated Tauri iOS project when the iOS target is missing
    cmds:
      - npm run tauri -- ios init

  ios:icons:
    desc: Manually refresh generated Tauri icons from the tracked Barbu app icon; run only after intentionally changing src-tauri/icons/icon.png
    cmds:
      - npm run tauri -- icon src-tauri/icons/icon.png

  ios:clean:generated:
    desc: Delete the ignored generated Tauri iOS project so the next init/build starts from tracked config
    cmds:
      - rm -rf src-tauri/gen/apple

  ios:reinit:
    desc: Delete and recreate the generated Tauri iOS project
    cmds:
      - task: ios:clean:generated
      - npm run tauri -- ios init
      - task: ios:disable:script:sandbox

  ios:disable:script:sandbox:
    desc: Disable Xcode user script sandboxing in the ignored generated iOS project so Tauri's Rust build script can read project files
    cmds:
      - perl -0pi -e 's/ENABLE_USER_SCRIPT_SANDBOXING = YES;/ENABLE_USER_SCRIPT_SANDBOXING = NO;/g' src-tauri/gen/apple/barbu-app.xcodeproj/project.pbxproj

  ios:dev:device:
    desc: Run on a physical iPhone with network dev-server support; pass device name with `task ios:dev:device -- "Martin's iPhone"`
    cmds:
      - task: ios:disable:script:sandbox
      - npm run tauri -- ios dev {{.CLI_ARGS}} --host

  ios:run:
    desc: Build the frontend and run the production iOS app on a simulator/device; pass device name with `task ios:run -- "Martin's iPhone"`
    cmds:
      - task: ios:disable:script:sandbox
      - npm run tauri -- ios run {{.CLI_ARGS}}

  ios:build:
    desc: Build an iOS IPA; pass options such as `task ios:build -- --debug --target aarch64`
    cmds:
      - task: ios:disable:script:sandbox
      - npm run tauri -- ios build {{.CLI_ARGS}}

  ios:install:device:
    desc: Build, install, and launch a self-contained iOS app on the default physical iPhone; override with `IOS_DEVICE_ID=...`
    vars:
      IOS_DEVICE_ID: '{{default "00008140-001814310187001C" .IOS_DEVICE_ID}}'
    cmds:
      - task: ios:disable:script:sandbox
      - npm run tauri -- ios build --debug --target aarch64
      - xcrun devicectl device install app --device {{.IOS_DEVICE_ID}} src-tauri/gen/apple/build/arm64/Barbu.ipa
      - xcrun devicectl device process launch --device {{.IOS_DEVICE_ID}} com.martin.barbu

  ios:install:device:clean:
    desc: Recreate the generated iOS project, then build, install, and launch on the default physical iPhone
    vars:
      IOS_DEVICE_ID: '{{default "00008140-001814310187001C" .IOS_DEVICE_ID}}'
    cmds:
      - task: ios:reinit
      - npm run tauri -- ios build --debug --target aarch64
      - xcrun devicectl device install app --device {{.IOS_DEVICE_ID}} src-tauri/gen/apple/build/arm64/Barbu.ipa
      - xcrun devicectl device process launch --device {{.IOS_DEVICE_ID}} com.martin.barbu

  ios:devices:
    desc: List iOS simulators and connected devices known to Xcode
    cmds:
      - xcrun xctrace list devices

  ios:open:
    desc: Open the generated iOS project in Xcode for signing/device troubleshooting
    cmds:
      - npm run tauri -- ios dev --open --host

  android:dev:
    desc: Run the Tauri Android development target
    cmds:
      - npm run tauri:android
