[package]
name = "barbu-app"
version = "1.0.1"
edition.workspace = true
publish = false

[lib]
name = "barbu_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
barbu-core = { path = "../crates/barbu-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
